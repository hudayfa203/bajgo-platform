name: bajgo_customer
description: "BajGo customer app - Bajaaj rides and deliveries in Garowe."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # intl is pinned by flutter_localizations for the SDK in use (0.19.x on 3.24).
  intl: any

  # State & navigation (plain Riverpod providers, no code generation)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & realtime
  dio: ^5.5.0
  socket_io_client: ^2.0.3
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Maps & location (OSM tiles by default; tile URL comes from --dart-define TILE_URL)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true # gen_l10n from lib/l10n/*.arb (see l10n.yaml)

  assets:
    - assets/brand/

  # Brand fonts are bundled (converted from packages/brand woff2 to static TTF),
  # so the app renders correctly offline with no runtime font download.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# `dart run flutter_launcher_icons` (run in CI before the build)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon_1024.png"
  adaptive_icon_background: "#1E4AD6"
  adaptive_icon_foreground: "assets/brand/app_icon_adaptive_fg_1024.png"
  min_sdk_android: 23
  remove_alpha_ios: true

# `dart run flutter_native_splash:create` (run in CI before the build)
flutter_native_splash:
  color: "#1E4AD6"
  image: "assets/brand/BajGo_Symbol_White.png"
  color_dark: "#1E4AD6"
  image_dark: "assets/brand/BajGo_Symbol_White.png"
  android_12:
    color: "#1E4AD6"
    image: "assets/brand/BajGo_Symbol_White.png"
    icon_background_color: "#1E4AD6"
  android: true
  ios: true
  fullscreen: false
