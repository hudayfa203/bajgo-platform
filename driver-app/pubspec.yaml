name: bajgo_driver
description: BajGo Driver - Bajaaj ride & delivery driver app for Garowe.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & realtime
  dio: ^5.5.0
  socket_io_client: ^2.0.3+1
  uuid: ^4.4.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.10

  # Media & UI
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/sounds/
    - assets/splash/

  fonts:
    # Brand fonts are bundled (converted from packages/brand) so no runtime
    # font download is needed on slow networks.
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon: Driver variant from packages/brand/app-icons (Saffron tile, Night symbol).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFC21A"
  adaptive_icon_foreground: "assets/icons/icon_adaptive_fg.png"

# Splash: Saffron background with the Night symbol.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFC21A"
  image: assets/splash/splash_symbol.png
  android: true
  ios: false
  android_12:
    color: "#FFC21A"
    image: assets/splash/splash_symbol_android12.png
    icon_background_color: "#FFC21A"
