name: Android APKs

# Builds the two installable demo APKs and uploads them as downloadable artifacts.
# Run it from the Actions tab (Run workflow) or let it run on every push to main.

on:
  push:
    branches: [main]
    paths:
      - 'customer-app/**'
      - 'driver-app/**'
      - '.github/workflows/android-apks.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for the LIVE build (leave blank to build demo-only APKs)'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: customer-app
            artifact: BajGo-Customer-Demo
          - app: driver
            dir: driver-app
            artifact: BajGo-Driver-Demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: ${{ matrix.dir }}
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Generate native splash
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_native_splash:create || echo "splash generation skipped"

      - name: Analyze
        working-directory: ${{ matrix.dir }}
        # Informational: style lints must not block a demo build.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$RUNNER_TEMP/analyze.log" || true

      - name: Unit tests
        working-directory: ${{ matrix.dir }}
        run: flutter test 2>&1 | tee "$RUNNER_TEMP/test.log" || true

      # ---------------------------------------------------------------- demo APK
      # DEMO=true makes the app run against its on-device simulated backend:
      # no server needed, nothing real is booked or charged.
      - name: Build demo APK
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=DEMO=true \
            --dart-define=APP_ENV=demo \
            --dart-define=APP_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/${{ matrix.artifact }}.apk"

      # Raw job logs are not reachable from every environment, so the
      # interesting lines are re-emitted as annotations (readable over the API).
      - name: Diagnostics
        if: always()
        run: |
          emit() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            grep -nE "error|Error:|\.dart:[0-9]+:[0-9]+|FAILURE|What went wrong|Failed to|Exception" \
              "$file" | head -30 | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)
                echo "::error title=${{ matrix.app }} ${title}::${clean}"
              done
          }
          emit analyze "$RUNNER_TEMP/analyze.log"
          emit tests "$RUNNER_TEMP/test.log"
          emit build "$RUNNER_TEMP/build.log"
          if [ -f "$RUNNER_TEMP/test.log" ]; then
            tail -3 "$RUNNER_TEMP/test.log" | while IFS= read -r line; do
              echo "::warning title=${{ matrix.app }} test summary::$(printf '%s' "$line" | tr -d '\r')"
            done
          fi

      # ---------------------------------------------------------------- live APK (optional)
      - name: Build live APK
        if: ${{ github.event.inputs.api_base_url != '' }}
        working-directory: ${{ matrix.dir }}
        run: |
          flutter build apk --release \
            --dart-define=DEMO=false \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url }}/v1 \
            --dart-define=WS_URL=${{ github.event.inputs.api_base_url }} \
            --dart-define=APP_VERSION=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "../out/BajGo-${{ matrix.app }}-Live.apk"

      - name: Checksums
        run: |
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh *.apk
          for f in *.apk; do
            size=$(du -h "$f" | cut -f1)
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "::notice title=APK built::${f} · ${size} · sha256 ${sum}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
