name: Android APKs

# Builds the two installable demo APKs and uploads them as downloadable artifacts.
# Run it from the Actions tab (Run workflow) or let it run on every push to main.

on:
  push:
    branches: [main]
    paths:
      - 'customer-app/**'
      - 'driver-app/**'
      - '.github/workflows/android-apks.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for the LIVE build (leave blank to build demo-only APKs)'
        required: false
        default: ''

jobs:
  build:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: customer-app
            artifact: BajGo-Customer-Demo
          - app: driver
            dir: driver-app
            artifact: BajGo-Driver-Demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Current stable: the plugin versions resolved by pub expect a recent
      # Flutter and a recent Android Gradle Plugin.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/version.log"
          head -1 "$RUNNER_TEMP/version.log" |
            while IFS= read -r line; do echo "::notice title=toolchain::${line}"; done

      - name: Pub get
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pubget.log"

      # gen_l10n writes lib/l10n/generated/app_localizations.dart (l10n.yaml).
      # Running it explicitly means `flutter analyze` and `flutter test` see it
      # too, not only the build.
      - name: Generate localizations
        working-directory: ${{ matrix.dir }}
        run: flutter gen-l10n 2>&1 | tee "$RUNNER_TEMP/l10n.log"

      - name: Generate launcher icons
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Generate native splash
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_native_splash:create || echo "splash generation skipped"

      - name: Analyze
        working-directory: ${{ matrix.dir }}
        # Informational: style lints must not block a demo build.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$RUNNER_TEMP/analyze.log" || true

      - name: Unit tests
        working-directory: ${{ matrix.dir }}
        run: flutter test 2>&1 | tee "$RUNNER_TEMP/test.log" || true

      # ---------------------------------------------------------------- demo APK
      # DEMO=true makes the app run against its on-device simulated backend:
      # no server needed, nothing real is booked or charged.
      - name: Build demo APK
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=DEMO=true \
            --dart-define=APP_ENV=demo \
            --dart-define=APP_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/${{ matrix.artifact }}.apk"

      # Raw job logs are not reachable from every environment, so the
      # interesting lines are re-emitted as annotations (readable over the API).
      - name: Diagnostics
        if: always()
        run: |
          emit() {
            title="$1"; file="$2"; pattern="$3"; cap="${4:-25}"
            [ -f "$file" ] || return 0
            grep -aE "$pattern" "$file" | head -"$cap" | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-380)
              echo "::error title=${{ matrix.app }} ${title}::${clean}"
            done
          }
          # Analyzer: real errors only (infos and warnings do not block).
          emit analyze "$RUNNER_TEMP/analyze.log" '^[[:space:]]*error[[:space:]]*•' 20
          # Tests: the failing assertion and its location.
          emit tests "$RUNNER_TEMP/test.log" '(\[E\]|Expected:|Actual:|^[[:space:]]*package:bajgo)' 15
          # Build: Dart/Kotlin compiler errors plus the Gradle failure blocks
          # with their following lines, which carry the actual cause.
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -aE -A6 '(What went wrong|Execution failed|Caused by)' \
              "$RUNNER_TEMP/build.log" | head -60 > "$RUNNER_TEMP/why.log" || true
            grep -aE '(^lib/.*:[0-9]+:[0-9]+:|^Error:|^e: |^ERROR:|^> )' \
              "$RUNNER_TEMP/build.log" | head -25 >> "$RUNNER_TEMP/why.log" || true
            sort -u "$RUNNER_TEMP/why.log" | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-380)
              [ -n "$clean" ] && echo "::error title=${{ matrix.app }} build::${clean}"
            done
          fi
          emit l10n "$RUNNER_TEMP/l10n.log" '(Error|error)' 5
          emit "pub get" "$RUNNER_TEMP/pubget.log" '(^Because|incompatible|version solving failed|depends on|requires)' 15
          if [ -f "$RUNNER_TEMP/test.log" ]; then
            grep -aE "tests passed|tests? failed" "$RUNNER_TEMP/test.log" | tail -2 |
              while IFS= read -r line; do
                echo "::warning title=${{ matrix.app }} test summary::$(printf '%s' "$line" | tr -d '\r')"
              done
          fi

      # ---------------------------------------------------------------- live APK (optional)
      - name: Build live APK
        if: ${{ github.event.inputs.api_base_url != '' }}
        working-directory: ${{ matrix.dir }}
        run: |
          flutter build apk --release \
            --dart-define=DEMO=false \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url }}/v1 \
            --dart-define=WS_URL=${{ github.event.inputs.api_base_url }} \
            --dart-define=APP_VERSION=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "../out/BajGo-${{ matrix.app }}-Live.apk"

      - name: Checksums
        run: |
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh *.apk
          for f in *.apk; do
            size=$(du -h "$f" | cut -f1)
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "::notice title=APK built::${f} · ${size} · sha256 ${sum}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
