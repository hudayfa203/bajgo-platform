name: Android APKs

# Builds the two installable demo APKs, uploads them as run artifacts and
# publishes them to a GitHub Release so a phone can download them in one tap.
# Run it from the Actions tab (Run workflow) or let it run on every push to main.

env:
  FLUTTER_VERSION: '3.47.7'

on:
  push:
    branches: [main]
    paths:
      - 'customer-app/**'
      - 'driver-app/**'
      - '.github/workflows/android-apks.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for the LIVE build (leave blank to build demo-only APKs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: customer-app
            artifact: BajGo-Customer-Demo-v2
          - app: driver
            dir: driver-app
            artifact: BajGo-Driver-Demo-v2

    steps:
      - uses: actions/checkout@v4

      # Each runner would otherwise generate its own debug keystore, so every
      # build would be signed with a different key and Android would refuse to
      # install it over the previous one.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bajgo-android-debug-keystore-v1

      - name: Create debug keystore if absent
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BajGo Demo, OU=BajGo, O=BajGo, L=Garowe, S=Nugaal, C=SO"
            echo "::notice title=keystore::created a new debug keystore"
          else
            echo "::notice title=keystore::reusing the cached debug keystore"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version both APKs are known to build with (run
      # 39153840454). Raising it means re-checking the Android toolchain
      # versions in android/settings.gradle and android/app/build.gradle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/version.log"
          head -1 "$RUNNER_TEMP/version.log" |
            while IFS= read -r line; do echo "::notice title=toolchain::${line}"; done

      - name: Pub get
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pubget.log"

      # gen_l10n writes lib/l10n/generated/app_localizations.dart (l10n.yaml).
      # Running it explicitly means `flutter analyze` and `flutter test` see it
      # too, not only the build.
      - name: Generate localizations
        working-directory: ${{ matrix.dir }}
        run: flutter gen-l10n 2>&1 | tee "$RUNNER_TEMP/l10n.log"

      - name: Generate launcher icons
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_launcher_icons || echo "icon generation skipped"

      - name: Generate native splash
        working-directory: ${{ matrix.dir }}
        run: dart run flutter_native_splash:create || echo "splash generation skipped"

      - name: Analyze
        working-directory: ${{ matrix.dir }}
        # Informational: style lints must not block a demo build.
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Unit tests
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log"

      # ---------------------------------------------------------------- demo APK
      # DEMO=true makes the app run against its on-device simulated backend:
      # no server needed, nothing real is booked or charged.
      - name: Build demo APK
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=DEMO=true \
            --dart-define=APP_ENV=demo \
            --dart-define=APP_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/${{ matrix.artifact }}.apk"

      # A per-architecture build is a third of the size. arm64-v8a covers every
      # Samsung phone sold in the last decade; armeabi-v7a is there for older ones.
      - name: Build per-architecture demo APKs
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --dart-define=DEMO=true \
            --dart-define=APP_ENV=demo \
            --dart-define=APP_VERSION=${{ github.run_number }} \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "../out/${{ matrix.artifact }}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "../out/${{ matrix.artifact }}-arm32.apk"

      # Raw job logs are not reachable from every environment, so the
      # interesting lines are re-emitted as annotations (readable over the API).
      - name: Diagnostics
        if: always()
        run: |
          emit() {
            title="$1"; file="$2"; pattern="$3"; cap="${4:-25}"
            [ -f "$file" ] || return 0
            grep -aE "$pattern" "$file" | head -"$cap" | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-380)
              echo "::error title=${{ matrix.app }} ${title}::${clean}"
            done
          }
          # Analyzer: real errors only (infos and warnings do not block).
          emit analyze "$RUNNER_TEMP/analyze.log" '^[[:space:]]*error[[:space:]]*•' 20
          # Tests: the failing assertion and its location.
          emit tests "$RUNNER_TEMP/test.log" '(\[E\]|Expected:|Actual:|^[[:space:]]*package:bajgo)' 15
          # Build: Dart/Kotlin compiler errors plus the Gradle failure blocks
          # with their following lines, which carry the actual cause.
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -aE -A6 '(What went wrong|Execution failed|Caused by)' \
              "$RUNNER_TEMP/build.log" | head -60 > "$RUNNER_TEMP/why.log" || true
            grep -aE '(^lib/.*:[0-9]+:[0-9]+:|^Error:|^e: |^ERROR:|^> )' \
              "$RUNNER_TEMP/build.log" | head -25 >> "$RUNNER_TEMP/why.log" || true
            sort -u "$RUNNER_TEMP/why.log" | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-380)
              [ -n "$clean" ] && echo "::error title=${{ matrix.app }} build::${clean}"
            done
          fi
          emit l10n "$RUNNER_TEMP/l10n.log" '(Error|error)' 5
          emit "pub get" "$RUNNER_TEMP/pubget.log" '(^Because|incompatible|version solving failed|depends on|requires)' 15
          if [ -f "$RUNNER_TEMP/test.log" ]; then
            grep -aE "tests passed|tests? failed" "$RUNNER_TEMP/test.log" | tail -2 |
              while IFS= read -r line; do
                echo "::warning title=${{ matrix.app }} test summary::$(printf '%s' "$line" | tr -d '\r')"
              done
          fi

      # ---------------------------------------------------------------- live APK (optional)
      - name: Build live APK
        if: ${{ github.event.inputs.api_base_url != '' }}
        working-directory: ${{ matrix.dir }}
        run: |
          flutter build apk --release \
            --dart-define=DEMO=false \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url }}/v1 \
            --dart-define=WS_URL=${{ github.event.inputs.api_base_url }} \
            --dart-define=APP_VERSION=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "../out/BajGo-${{ matrix.app }}-Live.apk"

      - name: Checksums
        run: |
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh *.apk
          for f in *.apk; do
            size=$(du -h "$f" | cut -f1)
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "::notice title=APK built::${f} · ${size} · sha256 ${sum}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect APKs
        run: |
          mkdir -p dist
          find incoming -name '*.apk' -exec cp {} dist/ \;
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt && ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="demo-build-${{ github.run_number }}"
          notes=$(cat <<'EOF'
          BajGo demo apps — install on an Android phone and test without a server.

          **Which file to download**
          - `BajGo-Customer-Demo-arm64.apk` / `BajGo-Driver-Demo-arm64.apk` — pick these
            on any modern phone, including every recent Samsung. Smallest download.
          - `BajGo-Customer-Demo-arm32.apk` / `BajGo-Driver-Demo-arm32.apk` — older 32-bit phones.
          - `BajGo-Customer-Demo.apk` / `BajGo-Driver-Demo.apk` — universal, works anywhere, largest.

          **Test sign-in**: any Somali number, OTP `123456` (also shown on screen).

          These are demo builds: the app runs against a simulated backend inside the
          app itself. No server, no SMS, no real money. They are debug-signed, so
          Android asks to allow installs from an unknown source.

          Full install and test guide: `docs/TESTING.md`.
          EOF
          )
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
            --title "BajGo demo apps · build ${{ github.run_number }}" \
            --notes "$notes" --latest
          echo "::notice title=release::$tag published with $(ls dist/*.apk | wc -l) APKs"
